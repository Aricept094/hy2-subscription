# Iran-first rule order: private/loopback and the fake-ip range first, then IR
# direct, then everything else via PROXY. NEVER a broad-direct Cloudflare/anycast
# rule — foreign anycast IPs must traverse the tunnel.
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,198.18.0.1/16,DIRECT,no-resolve   # the fake-ip range itself
  - GEOIP,IR,DIRECT
  - GEOSITE,CATEGORY-IR,DIRECT               # NOT "GEOSITE,IR" — that list does not exist in the current dat (verified)
  - DOMAIN-SUFFIX,ir,DIRECT
  - MATCH,PROXY
