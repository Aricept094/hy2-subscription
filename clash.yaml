# mihomo §7.6 — Iran-first block, MAXIMAL form (R2.1)
# Target: mihomo >= 1.19.x (Clash Verge Rev 2.5.2 bundles mihomo 1.19.29)
# Validated: mihomo -t -f <this file> on mihomo v1.19.29 linux-amd64 (2026-08-12)
#
# IMPORTANT — no .srs in mihomo 1.19.x: mihomo has NO sing-box rule-set (.srs)
# support in the 1.19.x line. GeoIP/GeoSite rules use geodata-mode .dat files
# (MetaCubeX) only. sing-box rule_sets (chocolate4u / SagerNet .srs) are NOT
# consumable here; do not try to point rule-provider at .srs URLs.
#
# GEOSITE category name: the current MetaCubeX/meta-rules-dat@release geosite.dat
# ships the Iran category as "CATEGORY-IR" (verified 2026-08-12: bare "ir" is not
# present and GEOSITE,IR,DIRECT fails the config test with "list ir not found").
# GEOSITE,CATEGORY-IR,DIRECT loads 190 records. GEOIP,IR,DIRECT loads 2,752 records.
#
# Failure semantics of geodata download (MEASURED 2026-08-12, mihomo 1.19.29):
# a failed/404 geox-url fetch stores the invalid payload, GEOIP/GEOSITE rules then
# fail to decode, and mihomo EXITS FATAL at startup (exit 1) with:
#   level=fatal msg="Parse config error: rules[0] [GEOIP,IR,DIRECT] error: [GeoIP]
#   failed to decode geodata file: GeoIP.dat, base error: proto: cannot parse
#   invalid wire-format data"
# There is NO degraded/partial mode and NO retry within the same start. Operator
# must verify geox-url reachability + file integrity at deploy time and watch
# startup logs. The @latest branch URL 404s (verified) — never use it; @release only.

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# --- GeoData (MetaCubeX/meta-rules-dat @release — NOT @latest: that URL 404s) ---
geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.ir'        # .ir never fake-ips: GEOIP/GEOSITE need real answers for .ir matching
    - '+.lan'
    - '+.local'
  default-nameserver:
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    '+.ir':
      - 185.55.226.26   # Begzar plain DNS — DoH hostname dns.begzar.ir is NXDOMAIN-public (T3, 2026-08-12)
      - 185.55.226.24   # Begzar alt — in-country re-verify per §4.6 D10 before relying on it
  proxy-server-nameserver:
    - 1.1.1.1           # bootstrap for proxy-server hostnames; never resolved through the tunnel
  fallback:
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: IR      # answers asserting an IR origin are trusted for .ir policy; others fall back
    ipcidr:
      - 240.0.0.0/4

